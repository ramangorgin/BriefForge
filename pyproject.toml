[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brief-forge"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "feedparser>=6.0.11",
]

[project.scripts]
brief-forge = "brief_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
